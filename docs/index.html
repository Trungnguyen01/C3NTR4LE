    <script>
      // Ngăn chặn lỗi khi môi trường hoặc thư viện cố gắng ghi đè window.fetch
      try {
        const originalFetchDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
        if (originalFetchDesc && !originalFetchDesc.set) {
          Object.defineProperty(window, 'fetch', {
            get: originalFetchDesc.get,
            set: function(val) {
              console.warn('Ignored attempt to overwrite window.fetch');
            },
            configurable: true,
            enumerable: originalFetchDesc.enumerable
          });
        }
      } catch (e) {
        console.error('Failed to patch fetch', e);
      }
      
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('Cannot set property fetch of #<Window> which has only a getter')) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
    </script>
